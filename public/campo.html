<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f181e">
<link rel="manifest" href="/campo.webmanifest">
<link rel="icon" href="/img/campo-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/logo-bordeaux.png">
<title>Campo · Marramiero</title>
<style>
  :root { --wine: #3f181e; --cream: #f4ede2; --ink: #241014; --ink-soft: #6b5f52; --line: #e3d9cb; --ok: #2e7d32; --warn: #a06400; --bad: #b00020; --blue: #3b6fe0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--cream); color: var(--ink); font-size: 17px; -webkit-tap-highlight-color: transparent; }
  header { position: sticky; top: 0; z-index: 5; background: var(--wine); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  .net { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.15); }
  .net.off { background: #fbe3c8; color: var(--warn); }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  button, .btn { font: inherit; border: 0; border-radius: 12px; padding: 14px; min-height: 52px; background: var(--wine); color: #fff; font-weight: 600; cursor: pointer; }
  button.sec { background: #fff; color: var(--wine); border: 2px solid var(--wine); }
  button.big { width: 100%; font-size: 18px; }
  button.tile { background: #fff; color: var(--ink); border: 1px solid var(--line); text-align: left; font-weight: 600; }
  button:disabled { opacity: .5; }
  label { display: block; font-size: 14px; color: var(--ink-soft); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .pick { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: #fff; }
  .pick.on { border-color: var(--wine); background: #f7efe9; }
  .pick input[type=checkbox] { width: 24px; height: 24px; flex: none; }
  .pick .grow { flex: 1; }
  .pick input.area { width: 100px; flex: none; padding: 8px; }
  .muted { color: var(--ink-soft); font-size: 14px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #eee; color: var(--ink-soft); margin-left: 6px; }
  .badge.red { background: #fde2e4; color: var(--bad); } .badge.yellow { background: #fbe3c8; color: var(--warn); } .badge.green { background: #dcefd9; color: var(--ok); }
  .msg { padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 15px; }
  .msg.error { background: #fde2e4; color: var(--bad); } .msg.ok { background: #dcefd9; color: var(--ok); } .msg.warn { background: #fbe3c8; color: var(--warn); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; } .row > * { flex: 1 1 160px; min-width: 0; }
  .sticky-actions { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--cream) 30%); padding: 14px 0 calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
  .sticky-actions > * { flex: 1; }
  h2 { font-size: 17px; margin: 0 0 10px; }
</style>
</head>
<body>
<header><h1 id="campo-title">Campo</h1><span class="net" id="campo-net"></span></header>
<main id="campo"></main>
<script src="/js/prd-i18n.js"></script>
<script src="/js/campo.js"></script>
</body>
</html>
